<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOMBITA FOOD • قمبيطة فوود</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--g1:#0f4d2e;--g2:#1f7a47;--gold:#c9a24a;--bg:#f5f8f3;--tx:#1c2a21;--mu:#6a7a70}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:'Tajawal','Poppins',sans-serif;background:var(--bg);color:var(--tx);font-size:16px}
header{background:linear-gradient(160deg,var(--g1),var(--g2));color:#fff;text-align:center;padding:26px 16px 22px;border-bottom:3px solid var(--gold)}
.logo{width:112px;height:112px;border-radius:50%;margin:0 auto 10px;background:#fff;border:3px solid var(--gold);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--g1);font:700 34px Poppins}
.logo img{width:100%;height:100%;object-fit:contain}
header h1{font:700 22px Poppins;letter-spacing:.5px}
header p{color:#e6d39b;margin-top:4px;font-weight:700}
header small{display:block;opacity:.85;margin-top:2px}
.banner{margin:14px;border-radius:16px;overflow:hidden;background:#fff;border:1px solid #dfe8da;box-shadow:0 2px 8px #0f4d2e14}
.bt{padding:14px 16px;text-align:center}
.bt b{color:var(--g1);display:block;font-size:18px}
.bt span{color:var(--mu);font-size:14px}
.ph{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.ph img{width:100%;height:150px;object-fit:cover;display:block}
.bar{position:sticky;top:0;z-index:10;background:var(--bg);padding:10px 14px 6px;box-shadow:0 4px 8px -8px #000}
.search{width:100%;padding:12px 16px;border:1.5px solid #cfdccb;border-radius:14px;font:inherit;background:#fff;outline:none}
.search:focus{border-color:var(--g2)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--g2);color:var(--g1);background:#fff;padding:7px 15px;border-radius:20px;font:700 14px Tajawal;cursor:pointer}
.chip.on{background:var(--g1);color:#fff;border-color:var(--g1)}
main{padding:6px 14px 20px}
section{margin-top:18px}
section h2{color:var(--g1);font-size:20px;display:flex;align-items:center;gap:8px;margin-bottom:10px}
section h2::after{content:"";flex:1;height:2px;background:linear-gradient(to left,transparent,var(--gold))}
.note{font-size:13px;color:var(--mu);margin:-4px 0 8px}
.grid{display:grid;gap:10px}
.card{background:#fff;border-radius:14px;padding:13px 14px;display:flex;justify-content:space-between;gap:12px;box-shadow:0 2px 8px #0f4d2e14;border:1px solid #e6eee2;position:relative}
.card h3{font:700 16px Poppins,Tajawal;direction:ltr;text-align:right;color:var(--tx)}
.card p{font-size:13.5px;color:var(--mu);margin-top:4px;direction:ltr;text-align:right;line-height:1.5}
.price{flex:none;align-self:center;background:var(--g1);color:#fff;border-radius:10px;padding:6px 10px;font:700 15px Poppins;direction:ltr;white-space:nowrap}
.price small{color:#e6d39b;font-size:11px}
.sig{display:inline-block;background:linear-gradient(135deg,#e2c46b,var(--gold));color:#3b2d05;font:700 10px Poppins;padding:2px 8px;border-radius:8px;margin-inline-start:6px;vertical-align:middle;letter-spacing:.5px}
.empty{display:none;text-align:center;color:var(--mu);padding:40px 0}
footer{background:var(--g1);color:#fff;text-align:center;padding:22px 16px 30px;border-top:3px solid var(--gold)}
footer b{color:#e6d39b}
footer p{margin-top:6px;font-size:14px;opacity:.9}
#top{position:fixed;bottom:18px;left:18px;width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);background:var(--g1);color:#fff;font-size:20px;cursor:pointer;opacity:0;pointer-events:none;transition:.25s}
#top.show{opacity:1;pointer-events:auto}
</style>
</head>

const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

menu.innerHTML=D.map(c=>`<section id="${c.id}" data-c="${c.id}"><h2>${c.t}</h2>${c.id=="tacos"?'<div class="note">Gratini: +200 DA</div>':''}<div class="grid">${c.i.map(([a,b,p,s])=>`<div class="card" data-s="${esc((a+" "+b).toLowerCase())}"><div><h3>${esc(a)}${s?'<span class="sig">SIGNATURE</span>':''}</h3>${b?`<p>${esc(b)}</p>`:''}</div><div class="price">${p?p+' <small>DA</small>':'—'}</div></div>`).join("")}</div></section>`).join("");

chips.innerHTML=[{id:"all",t:"الكل"},...D].map(c=>`<button class="chip${c.id=="all"?' on':''}" data-id="${c.id}">${c.t}</button>`).join("");
chips.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;cat=b.dataset.id;
  document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x==b));
  $("#q").value="";apply();scrollTo({top:0,behavior:"smooth"})};
$("#q").oninput=()=>{if($("#q").value&&cat!="all"){cat="all";document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.dataset.id=="all"))}apply()};

function apply(){
  const q=$("#q").value.trim().toLowerCase();let any=false;
  document.querySelectorAll("section").forEach(s=>{
    let n=0;
    s.querySelectorAll(".card").forEach(c=>{const ok=!q||c.dataset.s.includes(q)||s.querySelector("h2").textContent.includes(q);c.style.display=ok?"":"none";if(ok)n++});
    const show=n>0&&(cat=="all"||s.dataset.c==cat);s.style.display=show?"":"none";if(show)any=true;
  });
  $("#empty").style.display=any?"none":"block";
}

function img(el,src,alt,cls){
  if(!src)return;const i=new Image();i.alt=alt;
  i.onload=()=>{el.innerHTML="";el.appendChild(i)};i.src=src;
}
img($("#logo"),LOGO,"GOMBITA FOOD");

const t=$("#top");onscroll=()=>t.classList.toggle("show",scrollY>400);
t.onclick=()=>scrollTo({top:0,behavior:"smooth"});
</script>
</body>
</html>
